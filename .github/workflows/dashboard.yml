name: Dashboard
on:
  pull_request:
    branches: [v1]
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  push:
    branches: ['feat/dashboard-integridad-mapa-finanzas']
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    env:
      GANPRO_TEST_DATABASE_URL: postgres://ganpro:ganpro_local_test@127.0.0.1:5432/ganpro_dashboard_tests
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55442
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-key
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ganpro
          POSTGRES_PASSWORD: ganpro_local_test
          POSTGRES_DB: ganpro_dashboard_tests
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ganpro -d ganpro_dashboard_tests" --health-interval 5s --health-timeout 5s --health-retries 10
      postgrest:
        image: postgrest/postgrest:v12.2.12
        env:
          PGRST_DB_URI: postgres://authenticator:ganpro_rest_local@postgres:5432/ganpro_dashboard_tests
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: ganpro_local_only_jwt_secret_32_characters
        ports: ['55441:3000']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db:migrate
      - run: npm run test:db
      - name: Start REST after database roles and schema exist
        env:
          REST_CONTAINER: ${{ job.services.postgrest.id }}
        run: |
          docker restart "$REST_CONTAINER"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:55441/ > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$REST_CONTAINER"
          exit 1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser with real PostgreSQL, PostgREST and test Auth
        run: |
          node tests/e2e/local-services.mjs > /tmp/ganpro-local-services.log 2>&1 &
          npm run start -- -p 3005 -H 127.0.0.1 > /tmp/ganpro-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3005/login > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-results
          path: dashboard/test-results/
